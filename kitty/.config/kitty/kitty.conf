# Font
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor (Material Design primary gold)
cursor                  #ebc161
cursor_text_color       #0c1518
cursor_shape            beam
cursor_blink_interval   0.5

# Scrollback
scrollback_lines 10000

# Mouse
url_color        #92d0e6
url_style        curly
copy_on_select   clipboard

# Bell
enable_audio_bell no
visual_bell_duration 0

# Window
background_opacity   0.92
window_padding_width 8
confirm_os_window_close 0
initial_window_width  120c
initial_window_height 36c

# Tab bar
tab_bar_style       powerline
tab_bar_min_tabs    2
tab_powerline_style slanted
active_tab_foreground   #0c1518
active_tab_background   #ebc161
active_tab_font_style   bold
inactive_tab_foreground #849399
inactive_tab_background #192124
inactive_tab_font_style normal

# ── Material Design Dark Theme ──────────────────────────

foreground #dbe4e8
background #0c1518

selection_foreground #0c1518
selection_background #ebc161

# Black (surface)
color0  #0c1518
color8  #323a3e

# Red (error)
color1  #ffb4ab
color9  #ffdad6

# Green (tertiary teal)
color2  #92d0e6
color10 #b4ebff

# Yellow (primary gold)
color3  #ebc161
color11 #ffdf9c

# Blue (outline)
color4  #849399
color12 #b9c9d0

# Magenta (secondary lavender)
color5  #cbc1e9
color13 #e7deff

# Cyan (tertiary)
color6  #a5cdd4
color14 #b4ebff

# White (on_background)
color7  #dbe4e8
color15 #ffffff
