# Source Material Design colors
source = ~/.config/hypr/colors.conf

# BACKGROUND
background {
    monitor =
    path = ~/Bilder/wallpapers/hyprlock_bg.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}


# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = $on_background
    font_size = 90
    font_family = JetBrains Mono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = $on_background
    font_size = 40
    font_family = JetBrains Mono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# Time (24-hour format)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %H:%M -")</span>"
    color = $on_background
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = $HOME/Bilder/wallpapers/hyprlock_user.jpg
    border_size = 2
    border_color = $primary
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = $surface_container
    rounding = -1
    border_size = 0
    border_color = $outline_variant
    rotate = 0
    xray = false

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = $on_background
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outline_variant
    inner_color = $surface_container
    font_color = $on_background
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <i><span foreground="##849399">Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = <span size="50pt"> 󰜉 </span>
    color = $on_surface_variant
    font_size = 50
    onclick = reboot now
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = <span size="50pt"> 󰐥 </span>
    color = $on_surface_variant
    font_size = 50
    onclick = shutdown now
    position = 800, 100
    halign = left
    valign = bottom
}

# Suspend
label {
    monitor =
    text = <span size="50pt"> 󰤄 </span>
    color = $on_surface_variant
    font_size = 50
    onclick = systemctl suspend
    position = -800, 100
    halign = right
    valign = bottom
}
